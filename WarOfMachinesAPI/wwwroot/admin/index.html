<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin</title>
    <style>
        :root {
            --bg:#101216;
            --panel:#181c23;
            --panel2:#121720;
            --text:#eef1f5;
            --muted:#97a1af;
            --border:#2a303b;
            --btn:#202838;
            --btnh:#2a354a;
            --online:#54d17a;
            --offline:#ff5f57;
            --warn:#ffd166;
        }
        * { box-sizing:border-box; }
        html, body { min-height:100%; }
        body {
            margin:0;
            background:var(--bg);
            color:var(--text);
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
        }
        header {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:14px 18px;
            border-bottom:1px solid var(--border);
            background:#13171d;
        }
        h1 {
            margin:0;
            font-size:18px;
            font-weight:700;
        }
        nav {
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            justify-content:flex-end;
        }
        a.btn {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:38px;
            padding:9px 13px;
            border-radius:8px;
            background:var(--btn);
            color:var(--text);
            text-decoration:none;
            border:1px solid var(--border);
            font-weight:650;
            font-size:14px;
        }
        a.btn:hover { background:var(--btnh); }
        main {
            width:100%;
            max-width:960px;
            margin:0 auto;
            padding:18px;
            display:grid;
            gap:14px;
        }
        .panel {
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:8px;
            overflow:hidden;
        }
        .panel-head {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:14px 16px;
            border-bottom:1px solid var(--border);
            background:var(--panel2);
        }
        .panel-title {
            margin:0;
            font-size:16px;
        }
        .badge {
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:6px 10px;
            border:1px solid var(--border);
            border-radius:999px;
            color:var(--muted);
            font-weight:700;
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:.02em;
        }
        .dot {
            width:9px;
            height:9px;
            border-radius:50%;
            background:var(--warn);
        }
        .badge.online { color:var(--online); }
        .badge.online .dot { background:var(--online); }
        .badge.offline { color:var(--offline); }
        .badge.offline .dot { background:var(--offline); }
        .grid {
            display:grid;
            grid-template-columns:repeat(4, minmax(0, 1fr));
            gap:1px;
            background:var(--border);
        }
        .item {
            min-height:86px;
            padding:14px;
            background:var(--panel);
        }
        .label {
            color:var(--muted);
            font-size:12px;
            font-weight:650;
            text-transform:uppercase;
            letter-spacing:.04em;
        }
        .value {
            margin-top:8px;
            font-size:22px;
            font-weight:750;
            overflow-wrap:anywhere;
        }
        .wide { grid-column:span 2; }
        .message {
            padding:14px 16px;
            color:var(--muted);
            border-top:1px solid var(--border);
            min-height:52px;
            overflow-wrap:anywhere;
        }
        @media (max-width:720px) {
            header {
                align-items:flex-start;
                flex-direction:column;
            }
            nav {
                justify-content:flex-start;
            }
            .grid {
                grid-template-columns:repeat(2, minmax(0, 1fr));
            }
            .wide {
                grid-column:span 2;
            }
        }
        @media (max-width:420px) {
            main {
                padding:12px;
            }
            .grid {
                grid-template-columns:1fr;
            }
            .wide {
                grid-column:span 1;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Admin</h1>
    <nav>
        <a class="btn" href="/admin/logs">Logs</a>
        <a class="btn" href="/swagger" target="_blank" rel="noreferrer">Swagger</a>
    </nav>
</header>

<main>
    <section class="panel">
        <div class="panel-head">
            <h2 class="panel-title">Unity Server</h2>
            <div id="onlineBadge" class="badge offline"><span class="dot"></span><span id="onlineText">Offline</span></div>
        </div>

        <div class="grid">
            <div class="item">
                <div class="label">Status</div>
                <div id="statusValue" class="value">offline</div>
            </div>
            <div class="item">
                <div class="label">Address</div>
                <div id="addressValue" class="value">-</div>
            </div>
            <div class="item">
                <div class="label">Port</div>
                <div id="portValue" class="value">-</div>
            </div>
            <div class="item">
                <div class="label">Players</div>
                <div id="playersValue" class="value">-</div>
            </div>
            <div class="item">
                <div class="label">Matches</div>
                <div id="matchesValue" class="value">-</div>
            </div>
            <div class="item">
                <div class="label">Heartbeat</div>
                <div id="heartbeatValue" class="value">never</div>
            </div>
            <div class="item">
                <div class="label">Last update</div>
                <div id="lastUpdateValue" class="value">-</div>
            </div>
            <div class="item">
                <div class="label">API polling</div>
                <div id="pollingValue" class="value">connecting</div>
            </div>
        </div>

        <div id="messageValue" class="message">No status message.</div>
    </section>
</main>

<script>
    const onlineBadge = document.getElementById('onlineBadge');
    const onlineText = document.getElementById('onlineText');
    const statusValue = document.getElementById('statusValue');
    const addressValue = document.getElementById('addressValue');
    const portValue = document.getElementById('portValue');
    const playersValue = document.getElementById('playersValue');
    const matchesValue = document.getElementById('matchesValue');
    const heartbeatValue = document.getElementById('heartbeatValue');
    const lastUpdateValue = document.getElementById('lastUpdateValue');
    const pollingValue = document.getElementById('pollingValue');
    const messageValue = document.getElementById('messageValue');

    function valueOrDash(value) {
        return value === null || value === undefined || value === '' ? '-' : value;
    }

    function formatDate(value) {
        if (!value) {
            return '-';
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return '-';
        }

        return date.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' }) + ' ' + date.toLocaleDateString();
    }

    function updateStatus(data) {
        const isOnline = data && data.isOnline === true;
        onlineBadge.classList.toggle('online', isOnline);
        onlineBadge.classList.toggle('offline', !isOnline);
        onlineText.textContent = isOnline ? 'Online' : 'Offline';

        statusValue.textContent = valueOrDash(data.status);
        addressValue.textContent = valueOrDash(data.address);
        portValue.textContent = valueOrDash(data.port);

        if (data.playersOnline !== null && data.playersOnline !== undefined && data.maxPlayers !== null && data.maxPlayers !== undefined) {
            playersValue.textContent = `${data.playersOnline}/${data.maxPlayers}`;
        } else {
            playersValue.textContent = valueOrDash(data.playersOnline);
        }

        matchesValue.textContent = valueOrDash(data.activeMatches);
        heartbeatValue.textContent = data.secondsSinceHeartbeat === null || data.secondsSinceHeartbeat === undefined
            ? 'never'
            : `${data.secondsSinceHeartbeat}s ago`;
        lastUpdateValue.textContent = formatDate(data.lastHeartbeatUtc);
        messageValue.textContent = data.message || 'No status message.';
        pollingValue.textContent = 'connected';
    }

    async function pollStatus() {
        try {
            const response = await fetch('/unity-server/status', { cache:'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            updateStatus(await response.json());
        } catch (error) {
            pollingValue.textContent = 'error';
        }
    }

    pollStatus();
    setInterval(pollStatus, 2000);
</script>
</body>
</html>
